name: Build and Smoke Test Executables

permissions:
  contents: read

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  version-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check version sync
        run: python3 tools/check_version_sync.py

  build-executables:
    needs: version-sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Poetry
        run: |
          python -m pip install --user poetry
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install build dependencies
        run: poetry install --with build --no-interaction --no-ansi

      - name: Build executable bundles
        run: poetry run build_backends

      - name: Smoke test built executables
        run: make test_built_services
